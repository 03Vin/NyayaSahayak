{% extends 'base.html' %}

{% block title %}Login - NyayaSahayak{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom py-3">
                    <h4 class="card-title mb-0 fw-bold text-center text-primary">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to NyayaSahayak
                    </h4>
                </div>
                <div class="card-body p-4">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_username" class="form-label fw-semibold">Username</label>
                            <input type="text" name="username" autofocus required class="form-control" id="id_username" placeholder="Enter username">
                        </div>
                        <div class="mb-3">
                            <label for="id_password" class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" required class="form-control" id="id_password" placeholder="Enter password">
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-light text-center py-3">
                    <span class="text-muted">Don't have an account yet?</span>
                    <a href="{% url 'register' %}" class="fw-semibold text-decoration-none ms-1">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
